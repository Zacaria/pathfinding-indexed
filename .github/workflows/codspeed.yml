name: Benchmark smoke tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        name: Checkout
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('Cargo.toml') }}

      - uses: dtolnay/rust-toolchain@stable
        name: Install Rust toolchain

      - uses: baptiste0928/cargo-install@v3
        name: Install cargo-codspeed (with cache)
        with:
          crate: cargo-codspeed
          version: "5.0.1"

      - name: Build benchmarks
        run: cargo codspeed build --locked --measurement-mode walltime

      - name: Run wall-time benchmark smoke suite
        run: cargo codspeed run --measurement-mode walltime
